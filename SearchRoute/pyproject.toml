[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "searchroute"
dynamic = ["version"]
description = "A pluggable web-search router for AI agents: one interface, many providers, free-tier quota tracking and automatic fallback."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["search", "agents", "llm", "rag", "tavily", "exa", "firecrawl", "router"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
ddg = ["ddgs>=9.0"]
extract = ["trafilatura>=1.12"]
yaml = ["PyYAML>=6.0"]
redis = ["redis>=5.0"]
# LLM tool integrations. The core tools module needs none of these — it
# emits plain dicts — so these only gate the framework adapters.
mcp = ["mcp>=2.0"]
langchain = ["langchain-core>=0.3"]
llamaindex = ["llama-index-core>=0.11"]
# Example agents only. The library itself never calls a model.
examples = ["anthropic>=0.40", "langchain-core>=0.3", "langchain>=0.3", "llama-index-core>=0.11", "mcp>=2.0"]
all = [
    "ddgs>=9.0",
    "trafilatura>=1.12",
    "PyYAML>=6.0",
    "redis>=5.0",
    "mcp>=2.0",
    "langchain-core>=0.3",
    "llama-index-core>=0.11",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "freezegun>=1.5",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/subhiram/searchroute"
Issues = "https://github.com/subhiram/searchroute/issues"

[tool.hatch.version]
path = "src/searchroute/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/searchroute"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
